<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Smart Grade | สมาร์ทเกรด — ตรวจง่าย ตัดไว พร้อมส่ง</title>
  <meta name="description" content="Smart Grade ระบบบันทึกส่งงานและตัดเกรดอัจฉริยะ ออกแบบเพื่อครูผู้สอน รองรับมือถือ iPad และคอมพิวเตอร์">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Smart Grade">
  <meta name="theme-color" content="#2563EB">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232563EB'/%3E%3Cpath d='M20 9.5L31.5 15.5L20 21.5L8.5 15.5L20 9.5Z' fill='white'/%3E%3Cpath d='M12.5 18V23.5C12.5 26 15.5 28.5 20 28.5C24.5 28.5 27.5 26 27.5 23.5V18' stroke='white' stroke-width='2.4' stroke-linecap='round' fill='none'/%3E%3Cpath d='M30.5 16V23.5L32.5 25' stroke='%2393C5FD' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='20' cy='15.5' r='1.8' fill='%2393C5FD'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=50">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-badge">
        <div class="brand-icon" id="app-brand-logo">
          <svg viewBox="0 0 40 40" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="10" fill="url(#brandGrad)"/>
            <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="9.25" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.5"/>
            <defs>
              <linearGradient id="brandGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#2563EB"/>
                <stop offset="100%" stop-color="#1E40AF"/>
              </linearGradient>
            </defs>
            <path d="M20 9.5L31.5 15.5L20 21.5L8.5 15.5L20 9.5Z" fill="#FFFFFF"/>
            <path d="M12.5 18V23.5C12.5 26 15.5 28.5 20 28.5C24.5 28.5 27.5 26 27.5 23.5V18" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
            <path id="logoTassel" d="M30.5 16V23.5L32.5 25" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
            <circle id="logoAccentDot" cx="20" cy="15.5" r="1.8" fill="#93C5FD"/>
          </svg>
        </div>
        <div class="brand-text-box">
          <h1 class="brand-title">Smart Grade</h1>
          <div class="brand-subtitle">
            <span class="desktop-subtitle">สมาร์ทเกรด — ตรวจง่าย ตัดไว พร้อมส่ง</span>
            <span class="mobile-subtitle">สมาร์ทเกรด</span>
          </div>
        </div>
      </div>

      <!-- Context Selector (วิชา & ห้องเรียน อยู่แถวเดียวกัน) -->
      <div id="context-selector-container" class="context-selector-container"></div>

      <!-- Desktop Nav Tabs -->
      <nav class="nav-tabs">
        <button class="nav-tab-btn active" data-tab="overview">
          <span>📊</span> ภาพรวม
        </button>
        <button class="nav-tab-btn" data-tab="grading">
          <span>✏️</span> เช็กส่งงาน
        </button>
        <button class="nav-tab-btn" data-tab="gradebook">
          <span>🎓</span> ทะเบียนคะแนน/ตัดเกรด
        </button>
        <button class="nav-tab-btn" data-tab="report">
          <span>📄</span> รายงาน/พิมพ์
        </button>
        <button class="nav-tab-btn" data-tab="students">
          <span>👥</span> รายชื่อ
        </button>
        <button class="nav-tab-btn" data-tab="assignments">
          <span>📚</span> ภาระงาน
        </button>
        <button class="nav-tab-btn" data-tab="settings">
          <span>⚙️</span> ตั้งค่า
        </button>
      </nav>

      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <div class="sync-status-indicator" id="manual-sync-btn" style="cursor: pointer;" title="คลิกเพื่อซิงค์ข้อมูลกับ Google Sheets">
          <span class="status-dot" id="sync-indicator-dot"></span>
          <span id="sync-indicator-label">บันทึกในเครื่องแล้ว</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="main-content" id="app-view-container">
    <!-- Rendered dynamically by app.js -->
  </main>

  <!-- Mobile Bottom Navigation Bar (จอเล็ก) -->
  <nav class="bottom-nav-bar" id="mobile-bottom-nav">
    <button class="bottom-nav-btn active" data-tab="overview">
      <span class="bottom-nav-icon">📊</span>
      <span class="bottom-nav-label">ภาพรวม</span>
    </button>
    <button class="bottom-nav-btn" data-tab="grading">
      <span class="bottom-nav-icon">✏️</span>
      <span class="bottom-nav-label">เช็กส่งงาน</span>
    </button>
    <button class="bottom-nav-btn" data-tab="gradebook">
      <span class="bottom-nav-icon">🎓</span>
      <span class="bottom-nav-label">ตัดเกรด</span>
    </button>
    <button class="bottom-nav-btn" data-tab="assignments">
      <span class="bottom-nav-icon">📚</span>
      <span class="bottom-nav-label">ภาระงาน</span>
    </button>
    <button class="bottom-nav-btn bottom-nav-tablet-only" data-tab="report">
      <span class="bottom-nav-icon">📄</span>
      <span class="bottom-nav-label">รายงาน</span>
    </button>
    <button class="bottom-nav-btn" data-tab="students">
      <span class="bottom-nav-icon">👥</span>
      <span class="bottom-nav-label">รายชื่อ</span>
    </button>
    <button class="bottom-nav-btn" data-tab="settings">
      <span class="bottom-nav-icon">⚙️</span>
      <span class="bottom-nav-label">ตั้งค่า</span>
    </button>
  </nav>

  <!-- แป้นกดคะแนนลอย (Floating Scoring Bar) สำหรับ iPad, Tablet และมือถือในหน้าตัดเกรด -->
  <div id="gb-floating-keypad" class="gb-floating-keypad" style="display: none;">
    <div class="gbf-inner">
      <div class="gbf-header">
        <div class="gbf-student-info">
          <span class="gbf-badge-no" id="gbf-no">เลขที่ 1</span>
          <span class="gbf-student-name" id="gbf-name">นายกันการ นุราช</span>
          <span class="gbf-col-badge" id="gbf-col">ข้อเขียนปลายภาค</span>
        </div>
        <div class="gbf-val-box">
          <span class="gbf-val-label">คะแนน:</span>
          <span class="gbf-val-num" id="gbf-val-display">-</span>
          <button type="button" class="gbf-close-btn" onclick="closeGradebookFloatingKeypad()" title="ปิดแป้นกดคะแนนลอย">✕</button>
        </div>
      </div>
      <div class="gbf-actions" id="gbf-actions">
        <!-- Rendered dynamically by app.js based on active column -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="html2canvas.min.js"></script>
  <script src="app.js?v=54"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=50').then((reg) => {
          console.log('[PWA] Service Worker registered with scope:', reg.scope);
        }).catch((err) => {
          console.warn('[PWA] Service Worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
