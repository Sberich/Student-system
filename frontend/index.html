<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Smart Grade | สมาร์ทเกรด — ตรวจง่าย ตัดไว พร้อมส่ง</title>
  <meta name="description" content="Smart Grade ระบบบันทึกส่งงานและตัดเกรดอัจฉริยะ ออกแบบเพื่อครูผู้สอน รองรับมือถือ iPad และคอมพิวเตอร์">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#2563EB">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232563EB'/%3E%3Cpath d='M12 21L18 27L29 14' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='29' cy='11' r='2.5' fill='%2393C5FD'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-badge">
        <div class="brand-icon" id="app-brand-logo">
          <svg viewBox="0 0 40 40" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="11" fill="url(#brandGrad)"/>
            <defs>
              <linearGradient id="brandGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#2563EB"/>
                <stop offset="100%" stop-color="#1D4ED8"/>
              </linearGradient>
            </defs>
            <path d="M12 21L18 27L29 14" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle id="logoAccentDot" cx="29" cy="11" r="2.2" fill="#93C5FD"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Smart Grade</h1>
          <div class="brand-subtitle">สมาร์ทเกรด — ตรวจง่าย ตัดไว พร้อมส่ง</div>
        </div>
      </div>

      <!-- Context Selector (วิชา & ห้องเรียน อยู่แถวเดียวกัน) -->
      <div id="context-selector-container" class="context-selector-container"></div>

      <!-- Desktop Nav Tabs -->
      <nav class="nav-tabs">
        <button class="nav-tab-btn active" data-tab="overview">
          <span>📊</span> ภาพรวม
        </button>
        <button class="nav-tab-btn" data-tab="grading">
          <span>✏️</span> เช็กส่งงาน
        </button>
        <button class="nav-tab-btn" data-tab="gradebook">
          <span>🎓</span> ทะเบียนคะแนน/ตัดเกรด
        </button>
        <button class="nav-tab-btn" data-tab="report">
          <span>📄</span> รายงาน/พิมพ์
        </button>
        <button class="nav-tab-btn" data-tab="students">
          <span>👥</span> รายชื่อ
        </button>
        <button class="nav-tab-btn" data-tab="assignments">
          <span>📚</span> งานที่สั่ง
        </button>
        <button class="nav-tab-btn" data-tab="settings">
          <span>⚙️</span> ตั้งค่า
        </button>
      </nav>

      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <!-- Quick Theme Switcher Button -->
        <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="cycleTheme()" title="เปลี่ยนธีมสี (ฟ้า / เขียว / ม่วง / โหมดมืด)">
          🎨
        </button>

        <div class="sync-status-indicator" id="manual-sync-btn" style="cursor: pointer;" title="คลิกเพื่อซิงค์ข้อมูลกับ Google Sheets">
          <span class="status-dot" id="sync-indicator-dot"></span>
          <span id="sync-indicator-label">บันทึกในเครื่องแล้ว</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="main-content" id="app-view-container">
    <!-- Rendered dynamically by app.js -->
  </main>

  <!-- Mobile Bottom Navigation Bar (จอเล็ก) -->
  <nav class="bottom-nav-bar" id="mobile-bottom-nav">
    <button class="bottom-nav-btn active" data-tab="overview">
      <span class="bottom-nav-icon">📊</span>
      <span class="bottom-nav-label">ภาพรวม</span>
    </button>
    <button class="bottom-nav-btn" data-tab="grading">
      <span class="bottom-nav-icon">✏️</span>
      <span class="bottom-nav-label">เช็กส่งงาน</span>
    </button>
    <button class="bottom-nav-btn" data-tab="gradebook">
      <span class="bottom-nav-icon">🎓</span>
      <span class="bottom-nav-label">ตัดเกรด</span>
    </button>
    <button class="bottom-nav-btn" data-tab="students">
      <span class="bottom-nav-icon">👥</span>
      <span class="bottom-nav-label">รายชื่อ</span>
    </button>
    <button class="bottom-nav-btn" data-tab="settings">
      <span class="bottom-nav-icon">⚙️</span>
      <span class="bottom-nav-label">ตั้งค่า</span>
    </button>
  </nav>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="app.js"></script>
</body>
</html>
